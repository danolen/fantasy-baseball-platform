version: 2

seeds:
  - name: ros_core_assumptions
    description: >-
      Versioned retained-core / streaming assumptions for projected overall
      finish (#185, consumed by #188). One row per
      (assumption_set, format, player_type, pos_group): ROS $ core threshold
      (pos_group C rows override ALL), streamable hitter/pitcher slots per
      stable/balanced/aggressive scenario, and FA-rank windows
      (inclusive low-high) mapping scenarios to the replacement curve
      (aggressive = best-ranked window). Thresholds justified by
      mart_retained_core_evidence W2/W3 retention; slots by
      mart_streaming_churn_evidence adds percentiles; windows are the
      maintainer-agreed 2-5 / 5-10 / 10-15. 50s has no FAAB and is absent
      by design. Edit here — do not hardcode in SQL.
    config:
      column_types:
        core_threshold_ros: double
    columns:
      - name: assumption_set
        data_tests:
          - not_null
      - name: format
        data_tests:
          - not_null
      - name: player_type
        data_tests:
          - not_null
      - name: pos_group
        data_tests:
          - not_null
      - name: core_threshold_ros
        data_tests:
          - not_null

  - name: ros_player_overrides
    description: >-
      Manual retained-core overrides for projected overall finish (#185,
      consumed by #188): force_status core keeps a player's full ROS line,
      stream drops them to replacement. Lets the maintainer overrule the
      assumptions seed per player without changing SQL. Empty until needed.
    columns:
      - name: assumption_set
        data_tests:
          - not_null
      - name: nfbc_id
        data_tests:
          - not_null
          - unique
      - name: force_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['core', 'stream']

  - name: projection_divergence_thresholds
    description: >-
      Configurable elevated/extreme divergence ratios and minimum season
      sample sizes for mart_projection_rate_divergence (#206). Edit here —
      do not hardcode thresholds in the Streamlit app.
    config:
      # Athena seed load: agate infers INT when every cell looks whole
      # (e.g. extreme_ratio ``2.0`` / ``1.0``), then fails casting CSV
      # ``'2.0'`` → INT. Force doubles for ratio columns.
      column_types:
        elevated_ratio: double
        extreme_ratio: double
        min_sample_volume: double
    columns:
      - name: stat
        data_tests:
          - not_null
      - name: projection_slice
        data_tests:
          - not_null
      - name: elevated_ratio
        data_tests:
          - not_null
      - name: extreme_ratio
        data_tests:
          - not_null
      - name: min_sample_volume
        data_tests:
          - not_null

  - name: faab_bid_bucket_thresholds
    description: >-
      Configurable cutoffs for mart_faab_worksheet.bid_bucket (#61).
      Cheap / expensive / borderline FTN heat, high-own unlisted-FTN
      floor, FA scarcity count, and the owner_name_pattern used to find
      "your" roster for gap flags. Edit here — do not hardcode in Streamlit.
    config:
      # Athena seed load: agate infers INT when every cell looks whole,
      # then fails casting CSV ``'5.0'`` → INT. Force doubles.
      column_types:
        cheap_high_bid_max: double
        cheap_pct_of_faab_max: double
        expensive_high_bid_min: double
        expensive_pct_of_faab_min: double
        borderline_high_bid_min: double
        high_own_pct_min: double
        scarce_fa_count_max: double
        ros_value_keeper_min: double
    columns:
      - name: cheap_high_bid_max
        data_tests:
          - not_null
      - name: cheap_pct_of_faab_max
        data_tests:
          - not_null
      - name: expensive_high_bid_min
        data_tests:
          - not_null
      - name: expensive_pct_of_faab_min
        data_tests:
          - not_null
      - name: borderline_high_bid_min
        data_tests:
          - not_null
      - name: high_own_pct_min
        data_tests:
          - not_null
      - name: scarce_fa_count_max
        data_tests:
          - not_null
      - name: ros_value_keeper_min
        data_tests:
          - not_null
      - name: owner_name_pattern
        data_tests:
          - not_null

  - name: faab_theoretical_bid_baseline
    description: >-
      Per-format placeholder for projected remaining undrafted ROS-$
      (the denominator of theoretical_bid, #62 / The Process p. 199).
      Not a book figure — start here and iterate with history. Edit
      here; do not hardcode the pool in Streamlit. Join on
      league_config.format (oc / me / 50s).
    config:
      column_types:
        projected_remaining_undrafted_value: double
    columns:
      - name: format
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['oc', 'me', '50s']
      - name: projected_remaining_undrafted_value
        data_tests:
          - not_null

  - name: faab_pacing_curves
    description: >-
      Elite vs 1st-quartile cumulative FAAB spend by week from The Process
      2025 Appendix p. 76 (Adam Warner). $1,000 NFBC budget, FAAB weeks
      2–20 (week 1 is $0). Used by the in-season budget pacing widget
      (#64). Do not invent weeks 21–26. Edit here — Streamlit reads the
      same CSV from the repo.
    config:
      column_types:
        week: int
        elite_cumulative_spend: double
        first_quartile_cumulative_spend: double
    columns:
      - name: week
        data_tests:
          - not_null
          - unique
      - name: elite_cumulative_spend
        data_tests:
          - not_null
      - name: first_quartile_cumulative_spend
        data_tests:
          - not_null
