version: 2

# ROS SGP calibration unit tests (#184). Mock data is integer-/dyadic-linear
# so every OLS slope and blend step is bit-exact (see scripts/gen script).
# Covers: counting annualization, ratio context retention (no annualization),
# early vs late blend weights, and the ME historical fallback.

unit_tests:
  - name: test_ros_sgp_early_blend_annualizes_counting
    description: >-
      Early season (w=0.75): counting slopes annualize (9 -> 12) then blend with history (R -> 14.25); AVG keeps its raw slope and blends contexts; ME has no current leg and falls back to history.
    model: mart_ros_sgp_calibration
    given:
      - input: ref('season_scoring_calendar')
        format: sql
        rows: |
          select 2026 as season_year, 4 as scoring_periods, date '2026-03-27' as season_start_date
      - input: ref('mart_sgp_factors')
        format: sql
        rows: |
          select 'NFBC OC 2025 Overall Standings.csv' as _filename, cast(21.0 as double) as sgp_r, cast(9.0 as double) as sgp_hr, cast(21.0 as double) as sgp_rbi, cast(12.0 as double) as sgp_sb, cast(0.002 as double) as sgp_avg, cast(30.0 as double) as sgp_k, cast(12.0 as double) as sgp_w, cast(15.0 as double) as sgp_s, cast(-0.08 as double) as sgp_era, cast(-0.04 as double) as sgp_whip
          union all           select 'NFBC ME 2025 Overall Standings.csv' as _filename, cast(19.0 as double) as sgp_r, cast(8.0 as double) as sgp_hr, cast(19.0 as double) as sgp_rbi, cast(11.0 as double) as sgp_sb, cast(0.0018 as double) as sgp_avg, cast(28.0 as double) as sgp_k, cast(11.0 as double) as sgp_w, cast(13.0 as double) as sgp_s, cast(-0.07 as double) as sgp_era, cast(-0.036 as double) as sgp_whip
          union all           select 'NFBC 50s 2025 Overall Standings.csv' as _filename, cast(22.0 as double) as sgp_r, cast(9.5 as double) as sgp_hr, cast(22.5 as double) as sgp_rbi, cast(12.5 as double) as sgp_sb, cast(0.0021 as double) as sgp_avg, cast(31.0 as double) as sgp_k, cast(12.5 as double) as sgp_w, cast(15.5 as double) as sgp_s, cast(-0.084 as double) as sgp_era, cast(-0.044 as double) as sgp_whip
      - input: ref('stg_nfbc_in_season_overall_category_stats')
        format: sql
        rows: |
          select 'oc' as format, 11 as nfbc_league_id, 'o1' as owner, 't1' as team, 1 as standing_rank, cast(208.0 as double) as r, cast(200.0 as double) as hr, cast(900.0 as double) as rbi, cast(100.0 as double) as sb, cast(1.09375 as double) as avg, cast(1200.0 as double) as k, cast(80.0 as double) as w, cast(60.0 as double) as sv, cast(3.5 as double) as era, cast(1.25 as double) as whip, cast(1400.0 as double) as h, cast(5600.0 as double) as ab, cast(450.0 as double) as er, cast(1125.0 as double) as ip, cast(100.0 as double) as ha, cast(50.0 as double) as bb, date '2026-04-10' as snapshot_date, true as is_latest_snapshot
