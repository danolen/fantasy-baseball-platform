version: 2

models:
  - name: mart_faab_worksheet
    description: >-
      FAAB worksheet rows per league. Grain is (league, nfbc_id) for matched
      players. FTN-only rows may have null nfbc_id; those are unique on
      (league, player). Homonyms (e.g. two Max Muncys) share a display name
      but different nfbc_ids. bid_bucket is a role label (triage / tactical
      / strategic) from The Process pp. 200–201 — not an FTN dollar tertile.
      theoretical_bid is the p. 199 share of remaining FAAB
      (positive ros_value / per-format remaining-undrafted baseline).
      Both are null when remaining FAAB is 0. Observability only: never
      feed the lineup optimizer or FAAB what-if scoring.
    columns:
      - name: league
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: player
        data_tests:
          - not_null
      - name: bid_bucket
        description: >-
          triage = cheap (or unlisted-and-not-contested) gap-fill;
          tactical = short-term add; strategic = expensive FTN heat,
          unpriced high-own keeper-quality FA, or borderline bid at a
          scarce position. Null when my_faab_remaining is 0 / missing.
        data_tests:
          - accepted_values:
              arguments:
                values: ['triage', 'tactical', 'strategic']
      - name: theoretical_bid
        description: >-
          Integer FAAB dollars from The Process p. 199, adapted per #62:
          (greatest(ros_value, 0) / projected_remaining_undrafted_value)
          × my_faab_remaining. Denominator is the per-format placeholder
          in seed faab_theoretical_bid_baseline (not a book figure).
          Null when remaining FAAB is 0 / missing, when the baseline is
          missing, or when ros_value is null (no weekly ROS context).
          Non-positive ROS yields 0. Observability only.
    data_tests:
      # Matched / weekly rows: identity is NFBC id (handles name collisions).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league
              - nfbc_id
          config:
            where: "nfbc_id is not null"
      # FTN-only unmatched rows: no nfbc_id, so fall back to display name.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league
              - player
          config:
            where: "nfbc_id is null"

  - name: mart_weekly_lineup_inputs
    description: >-
      Weekly lineup input surface for hitters and pitchers (#58). Grain is
      one row per (league, owner, nfbc_id, row_type). Free agents (empty
      owner) are included. Hitter rows carry G/PA/AB/H/R/HR/RBI/SB and AVG
      numerators; pitcher rows carry G/GS, first_start_day, is_two_start,
      W/SV/K/IP and ratio numerators (hits_allowed, er, walks_allowed).
      Mon–Thu dollars and ``mt_*`` hitter components support Monday lock (#210).
      Fri–Sun ``fs_*`` components support Friday swap and split-week FAAB
      what-if (#187). Existing hitter eligibility flags are unchanged for UI
      compatibility.
    columns:
      - name: nfbc_id
        data_tests:
          - not_null
      - name: league
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: format
        data_tests:
          - accepted_values:
              arguments:
                values: ['oc', 'me', '50s']
      - name: row_type
        description: hitter or pitcher. Two-way players appear once per role.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['hitter', 'pitcher']
      - name: is_two_start
        description: >-
          Pitcher rows only. True when GS >= 2 or Opp lists two day codes.
          False when no start is listed; null only on hitter rows.
      - name: first_start_day
        description: >-
          Pitcher rows only. First Opp day code (MO/TU/WE/TH/FR/SA/SU).
          Null when Opp has no day code (typical RP) or on hitter rows.
      - name: projected_starts
        description: Pitcher rows only. Alias of GS from the weekly file.
      - name: ab
        description: Hitter projected at-bats (AVG denominator).
      - name: hits
        description: Hitter projected hits (AVG numerator).
      - name: ip
        description: Pitcher projected innings (ERA/WHIP denominator).
      - name: er
        description: Pitcher projected earned runs (ERA numerator).
      - name: hits_allowed
        description: Pitcher projected hits allowed (WHIP numerator part).
      - name: walks_allowed
        description: Pitcher projected walks (WHIP numerator part).
      - name: is_p_eligible
        description: 1 for pitcher rows (NFBC P slot); 0 for hitters.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league
              - owner
              - nfbc_id
              - row_type

  - name: mart_weekly_projections
    description: >-
      One row per (id, league). Carries weekly dollar values plus hitter and
      pitcher component stats when a Razzball weekly file row exists (#58).
      Mon–Thu dollars prefer the dedicated Hittertron scrape when present (#210);
      Fri–Sun dollars prefer the weekend scrape when present. Full-week dollars
      remain for FAAB context.
    columns:
      - name: id
        data_tests:
          - not_null
      - name: league
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: dollars_monday_thursday
        description: >-
          Mon–Thu hitter dollars: dedicated scrape `$` when present, else
          weekly-file `$ MT`.
      - name: has_weekly_hitting
        description: True when joined to the current weekly hitting file.
      - name: has_weekly_pitching
        description: True when joined to the current weekly pitching file.
      - name: has_monday_thursday_hitting
        description: True when joined to the current Mon–Thu hitting scrape (#210).
      - name: has_weekend_hitting
        description: True when joined to the current Fri–Sun hitting scrape.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - league

  - name: mart_faab_unmatched
    description: FTN FAAB rows with no NFBC ID match.
    columns:
      - name: player_clean
        data_tests:
          - not_null
      - name: league_size
        data_tests:
          - accepted_values:
              arguments:
                values: [12, 15]
                # Integer column; default quote=true emits varchar literals and
                # Athena TYPE_MISMATCH on IN (integer vs varchar).
                quote: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_clean
              - league_size

  - name: mart_sgp_factors
    description: One row per NFBC standings file.
    columns:
      - name: _filename
        data_tests:
          - unique
          - not_null

  - name: mart_ros_sgp_calibration
    description: >-
      ROS SGP calibration blending completed-season (2025) slopes with
      current-2026-season slopes reconstructed from the automated overall
      category-stat feed (#184; The Process 2024 pp. 71–75). Grain is one row
      per (format, category). Counting slopes annualize by the
      season-completion fraction; AVG/ERA/WHIP keep blended
      numerator/denominator team contexts instead. Blend weight on the
      current season is linear in completion. ME is historical-only
      (is_fallback). Consumed by the six rest-of-season SGP staging models.
    columns:
      - name: format
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: final_slope
        data_tests:
          - not_null

  - name: mart_sgp_percentiles
    description: One row per (_filename, category).
    columns:
      - name: _filename
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['R', 'HR', 'RBI', 'SB', 'AVG', 'K', 'W', 'S', 'ERA', 'WHIP']
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _filename
              - category

  - name: mart_preseason_overall_rankings_oc
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: mart_preseason_overall_rankings_me
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: mart_preseason_overall_rankings_50s
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: mart_rest_of_season_overall_rankings_oc
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: mart_rest_of_season_overall_rankings_me
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: mart_rest_of_season_overall_rankings_50s
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: mart_overall_category_mobility
    description: >-
      Overall-contest category cutlines and mobility from actual NFBC
      category-stat/points distributions. Grain is one row per contest,
      snapshot, team, and category. Primary signals are local marginal
      slope (±25 points), nearest point islands, and the 10/25/50/100
      raw-stat ladder. When a team sits near the top/bottom of a category
      and the preferred ±25 window does not exist, the missing anchor is
      clamped to the field extreme and slope_is_clamped is true rather
      than nulling the slope (#205). headroom_status distinguishes open /
      partial / maxed upside. Filter is_latest_snapshot for current
      decisions. Weight player projections with overall_points_per_raw_unit
      (do not invert raw_per_category_point in consumers).
    columns:
      - name: contest_key
        data_tests:
          - not_null
      - name: snapshot_date
        data_tests:
          - not_null
      - name: team_key
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['R', 'HR', 'RBI', 'SB', 'AVG', 'K', 'W', 'SV', 'ERA', 'WHIP']
      - name: raw_stat
        data_tests:
          - not_null
      - name: category_points
        data_tests:
          - not_null
      - name: higher_is_better
        data_tests:
          - not_null
      - name: is_ratio
        data_tests:
          - not_null
      - name: headroom_status
        description: >-
          Upside headroom relative to the field: open (full ±window
          available), partial (some teams above but less than the slope
          window), maxed (no team above — stop spending here, not missing
          data).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'partial', 'maxed']
      - name: slope_window_points
        data_tests:
          - not_null
      - name: slope_is_clamped
        description: >-
          True when the preferred ±slope_window_points band was unavailable
          on either side and the missing anchor was clamped to the field
          extreme (or the team's own position when already at that extreme).
        data_tests:
          - not_null
      - name: slope_up_is_clamped
        data_tests:
          - not_null
      - name: slope_down_is_clamped
        data_tests:
          - not_null
      - name: raw_gap_up_10
        description: Favorable raw units needed to gain ~10 category points.
      - name: raw_gap_up_25
        description: Favorable raw units needed to gain ~25 category points.
      - name: raw_gap_up_50
        description: Favorable raw units needed to gain ~50 category points.
      - name: raw_gap_up_100
        description: Favorable raw units needed to gain ~100 category points.
      - name: ladder_up_status_10
        description: "ok | clamped | maxed for the +10 upside rung."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'clamped', 'maxed']
      - name: ladder_up_status_25
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'clamped', 'maxed']
      - name: ladder_up_status_50
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'clamped', 'maxed']
      - name: ladder_up_status_100
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'clamped', 'maxed']
      - name: raw_per_category_point
        description: >-
          Local density: favorable raw units per category point across the
          ±slope_window_points band (or the clamped one-sided band at the
          field edge). Non-null for latest snapshots in multi-team contests.
        data_tests:
          - not_null:
              config:
                where: "is_latest_snapshot"
      - name: raw_unit_size
        description: >-
          Decision unit for overall_points_per_raw_unit: 1 for counting
          categories, 0.001 for AVG, 0.01 for ERA, 0.005 for WHIP.
        data_tests:
          - not_null
      - name: overall_points_per_raw_unit
        description: >-
          Reciprocal of raw_per_category_point scaled by raw_unit_size.
          Multiply a projected raw delta by this to estimate overall-point
          impact. Prefer this column over inverting raw_per_category_point
          in consumers.
        data_tests:
          - not_null:
              config:
                where: "is_latest_snapshot"
      - name: teams_at_current_points
        description: >-
          Teams sharing this category_points island (tie cluster size). Used
          by #186 as local density context for the noise floor.
      - name: tie_cluster_raw_width
        description: >-
          max_raw - min_raw among teams on the current point island. Zero when
          every team on the island has the same raw stat (classic integer tie).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - contest_key
              - snapshot_date
              - team_key
              - category

  - name: mart_weekly_category_plan
    description: >-
      Weekly category targets for overall contests (#186). Grain is one row
      per (league, team_key, category) on the latest mobility snapshot.
      Includes maintain pace and stretch weekly targets for +25/+50/+100
      category points, plus tie-cluster noise_floor_raw. Expected-lineup
      projection and gap labels are applied in the in-season app. Non-overall
      leagues are excluded.
    columns:
      - name: league
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: team_key
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['R', 'HR', 'RBI', 'SB', 'AVG', 'K', 'W', 'SV', 'ERA', 'WHIP']
      - name: maintain_weekly_target
        description: >-
          Counting: current_raw / weeks_elapsed. Ratio: current rate to hold.
      - name: stretch_weekly_target_25
        description: Weekly target to gain ~25 category points by season end.
      - name: stretch_weekly_target_50
        description: Weekly target to gain ~50 category points by season end.
      - name: stretch_weekly_target_100
        description: Weekly target to gain ~100 category points by season end.
      - name: noise_floor_raw
        description: >-
          max(tie_cluster_raw_width, raw_unit_size). Gaps at or below this
          are reported as no meaningful difference.
        data_tests:
          - not_null
      - name: weeks_elapsed
        data_tests:
          - not_null
      - name: weeks_remaining
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league
              - team_key
              - category

  - name: mart_projection_rate_divergence
    description: >-
      Observability flags when a Razzball weekly/weekend/Mon–Thu projection
      rate diverges from season-to-date realized rates (#206). Grain is
      (projection_slice, projection_as_of, nfbc_id, stat). Rows with Razzball
      placeholder nfbcid ``0`` (unmatched names; many players share one id)
      are excluded so the grain holds and season joins stay meaningful.
      Thresholds come from seed projection_divergence_thresholds. This mart
      must never feed optimize_week, FAAB what-if scoring, or any projection
      value.
    columns:
      - name: projection_slice
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekend', 'weekly', 'monday_thursday']
      - name: nfbc_id
        data_tests:
          - not_null
      - name: stat
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SB', 'HR', 'R', 'RBI', 'START']
      - name: divergence_flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - in_line
                  - elevated
                  - extreme
                  - depressed
                  - insufficient_sample
                  - unknown
                  - start_occurred
                  - start_missed
      - name: projection_as_of
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - projection_slice
              - projection_as_of
              - nfbc_id
              - stat
