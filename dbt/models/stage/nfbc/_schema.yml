version: 2

models:
  - name: stg_nfbc_roster_membership
    description: >-
      Weekly owned-roster membership from daily NFBC snapshots (#185).
      Grain is one row per (league, owner, nfbc_id, scoring week), anchored
      to the first snapshot of each Monday-start week (post-Sunday-FAAB
      roster). Free-agent rows are excluded. Configured leagues only.
    columns:
      - name: league
        data_tests:
          - not_null
      - name: owner
        data_tests:
          - not_null
      - name: nfbc_id
        data_tests:
          - not_null
      - name: week_key
        data_tests:
          - not_null

  - name: stg_nfbc_in_season_overall_overview
    description: >-
      Typed NFBC overall overview standings. Grain is one row per contest
      (source_league_key), snapshot_date, and team identity
      (nfbc_league_id + team). standing_rank is not unique — tied overall
      scores share a rank. Full history retained; filter
      is_latest_snapshot = true for the current contest snapshot.
    columns:
      - name: standing_rank
        data_tests:
          - not_null
      - name: owner
        data_tests:
          - not_null
      - name: team
        data_tests:
          - not_null
      - name: nfbc_league_id
        data_tests:
          - not_null
      - name: source_league_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: snapshot_date
        data_tests:
          - not_null
      - name: is_latest_snapshot
        data_tests:
          - not_null
      - name: format
        data_tests:
          - accepted_values:
              arguments:
                values: ['oc', 'me', '50s']
    data_tests:
      # Ties share standing_rank; team identity is nfbc_league_id + team
      # (matches team_key in stg_nfbc_overall_category_long).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_league_key
              - snapshot_date
              - nfbc_league_id
              - team

  - name: stg_nfbc_in_season_overall_category_stats
    description: >-
      Typed NFBC overall category-stat standings. Counting and ratio stats are
      numeric; unused placeholders are not present. Grain is contest,
      snapshot, nfbc_league_id, and team (standing_rank ties are expected).
      Full history retained; filter is_latest_snapshot = true for the
      current contest snapshot.
    columns:
      - name: standing_rank
        data_tests:
          - not_null
      - name: owner
        data_tests:
          - not_null
      - name: team
        data_tests:
          - not_null
      - name: nfbc_league_id
        data_tests:
          - not_null
      - name: source_league_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: snapshot_date
        data_tests:
          - not_null
      - name: is_latest_snapshot
        data_tests:
          - not_null
      - name: format
        data_tests:
          - accepted_values:
              arguments:
                values: ['oc', 'me', '50s']
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_league_key
              - snapshot_date
              - nfbc_league_id
              - team

  - name: stg_nfbc_in_season_overall_category_points
    description: >-
      Typed NFBC overall category-points standings. Point columns are named
      distinctly from raw stats (r_pts, hr_pts, ...). Grain is contest,
      snapshot, nfbc_league_id, and team (standing_rank ties are expected).
      Full history retained; filter is_latest_snapshot = true for the
      current contest snapshot.
    columns:
      - name: standing_rank
        data_tests:
          - not_null
      - name: owner
        data_tests:
          - not_null
      - name: team
        data_tests:
          - not_null
      - name: nfbc_league_id
        data_tests:
          - not_null
      - name: source_league_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('league_config')
                field: league
      - name: snapshot_date
        data_tests:
          - not_null
      - name: is_latest_snapshot
        data_tests:
          - not_null
      - name: format
        data_tests:
          - accepted_values:
              arguments:
                values: ['oc', 'me', '50s']
      - name: r_pts
        data_tests:
          - not_null
      - name: hr_pts
        data_tests:
          - not_null
      - name: avg_pts
        data_tests:
          - not_null
      - name: k_pts
        data_tests:
          - not_null
      - name: whip_pts
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_league_key
              - snapshot_date
              - nfbc_league_id
              - team

  - name: stg_nfbc_overall_category_long
    description: >-
      Unpivoted overall category stats + points. One row per contest,
      snapshot, team, and scoring category. Feeds mart_overall_category_mobility.
    columns:
      - name: contest_key
        data_tests:
          - not_null
      - name: snapshot_date
        data_tests:
          - not_null
      - name: team_key
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['R', 'HR', 'RBI', 'SB', 'AVG', 'K', 'W', 'SV', 'ERA', 'WHIP']
      - name: raw_stat
        data_tests:
          - not_null
      - name: category_points
        data_tests:
          - not_null
      - name: higher_is_better
        data_tests:
          - not_null
      - name: is_ratio
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - contest_key
              - snapshot_date
              - team_key
              - category

  - name: stg_nfbc_in_season_players_snapshots
    description: >-
      Typed cumulative NFBC in-season player stats by snapshot_date (#206).
      Deduped across league CSV files for the same day. Used only for
      realized-rate / start-occurrence observability — not as a projection.
    columns:
      - name: nfbc_id
        data_tests:
          - not_null
      - name: snapshot_date
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - nfbc_id
              - snapshot_date
